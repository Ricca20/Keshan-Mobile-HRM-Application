name: Automated Database Backup

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC — keeps Supabase free-tier DB alive
  workflow_dispatch: # Allow manual triggers

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Ping Database (Keep-Alive)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set! Go to Settings > Secrets > Actions to add it."
            exit 1
          fi

          echo "Pinging database to prevent Supabase free-tier suspension..."
          psql "$DATABASE_URL" -c "SELECT 1;" -q

          echo "Database is alive! Ping successful at $(date -u)."
