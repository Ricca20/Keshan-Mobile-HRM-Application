name: Database Backup (Encrypted)

# This repository is PUBLIC. Backups are never committed; they are encrypted with
# BACKUP_PASSPHRASE and uploaded as a short-lived workflow artifact.
# Restore: gpg --decrypt backup.sql.gz.gpg | gunzip | psql "$DATABASE_URL"

on:
  schedule:
    - cron: '0 22 * * *' # Daily at 22:00 UTC = 03:30 AM Sri Lanka Time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::DATABASE_URL and BACKUP_PASSPHRASE secrets must both be set."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump, compress and encrypt
        run: |
          set -euo pipefail
          # psql/pg_dump reject Prisma/Supabase-only query params such as ?pgbouncer=true
          PG_URL="${DATABASE_URL%%\?*}"
          umask 077
          pg_dump "$PG_URL" --no-owner --no-privileges \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" -o backup.sql.gz.gpg
          ls -l backup.sql.gz.gpg

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 14
          if-no-files-found: error
