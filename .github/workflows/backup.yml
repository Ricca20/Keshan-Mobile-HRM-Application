name: Automated Database Backup

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggers

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate Database Backup
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set!"
            exit 1
          fi
          
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          FILENAME="phoneshop_hrm_backup_$TIMESTAMP.sql"
          
          echo "Dumping database to $FILENAME..."
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -f $FILENAME
          
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.filename }}
          path: ${{ steps.dump.outputs.filename }}
          retention-days: 30
